# Copiar a: /etc/nginx/sites-available/marble-sales.conf
# Activar con un symlink en /etc/nginx/sites-enabled/

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream marble_frontend {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream marble_backend {
  server 127.0.0.1:4000;
  keepalive 32;
}

server {
  listen 80;
  server_name marble.example.com www.marble.example.com;

  client_max_body_size 20m;

  location = /health-backend {
    proxy_pass http://marble_backend/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://marble_backend/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://marble_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
